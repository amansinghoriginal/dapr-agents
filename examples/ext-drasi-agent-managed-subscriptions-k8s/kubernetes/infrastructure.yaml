apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: drasi-m2-demo
spec:
  selector:
    app: sre-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: drasi-m2-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: sre-postgres
  template:
    metadata:
      labels:
        app: sre-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.8-alpine3.20
          args:
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
          env:
            - name: POSTGRES_USER
              value: sre
            - name: POSTGRES_DB
              value: sre
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sre-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, sre, -d, sre]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: sre-database-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-redis
  namespace: drasi-m2-demo
spec:
  selector:
    app: agent-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-redis
  namespace: drasi-m2-demo
spec:
  serviceName: agent-redis
  replicas: 1
  selector:
    matchLabels:
      app: agent-redis
  template:
    metadata:
      labels:
        app: agent-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.1-alpine3.20
          args: [redis-server, --appendonly, "yes", --appendfsync, always]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
