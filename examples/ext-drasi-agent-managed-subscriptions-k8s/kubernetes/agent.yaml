apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-sre
  namespace: drasi-m2-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkout-sre
  template:
    metadata:
      labels:
        app: checkout-sre
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: checkout-sre
        dapr.io/app-port: "8001"
        dapr.io/sidecar-image: daprio/daprd:1.18.1
    spec:
      containers:
        - name: agent
          image: dapr-agents/agent-managed-drasi:built-by-setup
          imagePullPolicy: Never
          env:
            - name: ASSESSMENT_SERVICE
              value: checkout
            - name: PGHOST
              value: postgres.drasi-m2-demo.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: sre
            - name: PGDATABASE
              value: sre
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sre-postgres
                  key: password
          envFrom:
            - secretRef:
                name: sre-model
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
