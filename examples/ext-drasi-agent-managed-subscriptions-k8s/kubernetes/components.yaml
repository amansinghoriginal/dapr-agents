apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agent-pubsub
  namespace: drasi-m2-demo
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: agent-redis.drasi-m2-demo.svc.cluster.local:6379
    - name: redisPassword
      value: ""
scopes:
  - checkout-sre
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agent-egress
  namespace: drasi-system
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: agent-redis.drasi-m2-demo.svc.cluster.local:6379
    - name: redisPassword
      value: ""
scopes:
  - sre-router-reaction
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: agent-state
  namespace: drasi-m2-demo
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: agent-redis.drasi-m2-demo.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: redisDB
      value: "1"
    - name: keyPrefix
      value: appid
    - name: actorStateStore
      value: "true"
scopes:
  - checkout-sre
---
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: sre-router-retries
  namespace: drasi-system
scopes:
  - sre-router-reaction
spec:
  policies:
    retries:
      boundedInbound:
        policy: constant
        duration: 1s
        maxRetries: 5
  targets:
    components:
      drasi-pubsub-sre-router:
        inbound:
          retry: boundedInbound
---
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: sre-agent-retries
  namespace: drasi-m2-demo
scopes:
  - checkout-sre
spec:
  policies:
    retries:
      boundedInbound:
        policy: constant
        duration: 1s
        maxRetries: 5
  targets:
    components:
      agent-pubsub:
        inbound:
          retry: boundedInbound
