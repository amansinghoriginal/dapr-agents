apiVersion: v1
kind: Reaction
name: sre-router
spec:
  kind: DaprAgentRouter
  properties:
    routerId: drasi-system/sre-router-reaction
    egressPubsubName: agent-egress
  queries:
    checkout-server-errors: |
      title: Checkout server errors
      description: Individual checkout HTTP 5xx error records with errorId, service, statusCode, message, rolloutId, and marker. Each row is one observation, not an aggregate.
      usage: Monitor entering rows (i) for newly matching errors. Changed diagnostics are updates (u); a resolved or removed matching error leaves the result (d). rolloutId can identify a rollout worth following.
    checkout-rollout-status: |
      title: Checkout rollout status
      description: Individual checkout rollout records with rolloutId, service, status, message, and marker. Status is progressing, healthy, or failed. Each row is one rollout, not an aggregate.
      usage: Monitor updates (u) to follow an existing rollout's progress. Entering rows (i) are newly observed rollouts. Subscribing does not return a current snapshot or historical changes.
