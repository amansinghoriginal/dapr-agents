apiVersion: v1
kind: ContinuousQuery
name: checkout-server-errors
spec:
  mode: query
  sources:
    subscriptions:
      - id: sre-source
        nodes:
          - sourceLabel: service_errors
  query: >
    MATCH (e:service_errors)
    WHERE e.service = 'checkout' AND e.status_code >= 500 AND e.status_code < 600
    RETURN e.error_id AS errorId,
           e.service AS service,
           e.status_code AS statusCode,
           e.message AS message,
           e.rollout_id AS rolloutId,
           e.marker AS marker
---
apiVersion: v1
kind: ContinuousQuery
name: checkout-rollout-status
spec:
  mode: query
  sources:
    subscriptions:
      - id: sre-source
        nodes:
          - sourceLabel: rollout_status
  query: >
    MATCH (r:rollout_status)
    WHERE r.service = 'checkout'
    RETURN r.rollout_id AS rolloutId,
           r.service AS service,
           r.status AS status,
           r.message AS message,
           r.marker AS marker
