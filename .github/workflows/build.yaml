name: Drasi readiness validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lifecycle commit to validate
        required: true
        default: "3601e13236b7ccdd7874e83516319ffdeab16f02"
      docs_sha:
        description: Optional companion documentation commit to validate
        required: false
        default: ""

permissions:
  contents: read

jobs:
  minimum-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
      - name: Install ordinary extension wheel with released core 1.0.7
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/minimum-core-source.txt"
          uv build --package dapr-agents-ext-drasi --wheel --out-dir "$RUNNER_TEMP/extension-wheel"
          uv venv --no-config --no-project --python 3.11 "$RUNNER_TEMP/minimum-core"
          uv pip install --no-config --python "$RUNNER_TEMP/minimum-core/bin/python" \
            "dapr-agents==1.0.7" "$RUNNER_TEMP"/extension-wheel/*.whl \
            "pytest>=8,<10" "pytest-asyncio>=0.23,<2" "pytest-cov>=4.1,<8" "pytest-mock>=3.12,<4"
          uv pip check --no-config --python "$RUNNER_TEMP/minimum-core/bin/python"
      - name: Verify installed origins and run all extension tests
        env:
          DAPR_AGENTS_REQUIRE_DRASI: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/minimum-core/bin/python" -I - <<'PY' | tee "$RUNNER_TEMP/minimum-core-tests.log"
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path
          from zipfile import ZipFile

          import dapr_agents
          import dapr_agents.ext.drasi as drasi
          import pytest

          assert version("dapr-agents") == "1.0.7"
          for name in (
              "DrasiChangeEvent", "DrasiOperation", "register_drasi_trigger",
              "drasi_subscription_lifecycle", "DrasiSubscriptionLifecycle", "DrasiLifecycleError",
          ):
              assert getattr(drasi, name) is not None, name
          for module in (dapr_agents, drasi):
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(Path(sys.prefix).resolve()), path
              print(f"Installed {module.__name__}: {path}", flush=True)
          wheel, = (Path(os.environ["RUNNER_TEMP"]) / "extension-wheel").glob("*.whl")
          with ZipFile(wheel) as archive:
              for name in archive.namelist():
                  if name.startswith("dapr_agents/ext/drasi/") and name.endswith(".py"):
                      installed = Path(drasi.__file__).parent / name.removeprefix("dapr_agents/ext/drasi/")
                      assert installed.read_bytes() == archive.read(name), name
          repo = Path(os.environ["GITHUB_WORKSPACE"])
          raise SystemExit(pytest.main([
              str(repo / "ext"), "--import-mode=importlib", "-m", "not integration",
              "-o", "log_cli=false", "-q",
              f"--junitxml={os.environ['RUNNER_TEMP']}/minimum-core-results.xml",
          ]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-core-evidence
          path: |
            ${{ runner.temp }}/minimum-core-source.txt
            ${{ runner.temp }}/minimum-core-tests.log
            ${{ runner.temp }}/minimum-core-results.xml

  real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch real upstream release tags
        run: git fetch --no-recurse-submodules https://github.com/dapr/dapr-agents.git '+refs/tags/*:refs/tags/*'
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
      - name: Install locked dependencies
        run: uv sync --frozen --group test --extra drasi
      - name: Run isolated real-Dapr suite
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git diff --exit-code
          docker version
          docker compose version
          test ! -e "$RUNNER_TEMP/drasi-managed-runtime"
          uv run pytest -x --confcutdir=tests/integration/drasi_managed \
            tests/integration/drasi_managed --run-drasi-managed \
            --basetemp="$RUNNER_TEMP/drasi-managed-runtime" \
            --junitxml="$RUNNER_TEMP/runtime-results.xml" \
            -o log_cli_level=WARNING 2>&1 | tee "$RUNNER_TEMP/runtime-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-runtime-evidence
          path: |
            ${{ runner.temp }}/runtime-tests.log
            ${{ runner.temp }}/runtime-results.xml
            ${{ runner.temp }}/drasi-managed-runtime

  companion-docs:
    if: inputs.docs_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: amansinghoriginal/dapr-docs
          ref: ${{ inputs.docs_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - name: Install documentation tools
        run: npm ci --no-audit --no-fund
      - name: Build docs and resolve page references
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/docs-source.txt"
          npm run build -- --destination "$RUNNER_TEMP/docs-preview" 2>&1 | tee "$RUNNER_TEMP/docs-build.log"
          test -f "$RUNNER_TEMP/docs-preview/developing-ai/dapr-agents/integrations/providers/drasi/index.html"
          test -f "$RUNNER_TEMP/docs-preview/developing-ai/dapr-agents/integrations/providers/drasi-agent-managed-subscriptions/index.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-build-evidence
          path: |
            ${{ runner.temp }}/docs-source.txt
            ${{ runner.temp }}/docs-build.log
            ${{ runner.temp }}/docs-preview/developing-ai/dapr-agents/integrations/providers/drasi
            ${{ runner.temp }}/docs-preview/developing-ai/dapr-agents/integrations/providers/drasi-agent-managed-subscriptions
